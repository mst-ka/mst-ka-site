name: Deploy to Firebase Hosting
'on':
  push:
    branches:
      - main
  repository_dispatch:
    types: [wordpress-publish]
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm ci && npm run build
        env:
          NEXT_PUBLIC_WORDPRESS_API_URL: ${{ vars.NEXT_PUBLIC_WORDPRESS_API_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MST_KA }}'
          channelId: live
          projectId: mst-ka
